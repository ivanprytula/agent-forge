[project]
name = "agent-forge"
version = "0.1.0"
description = "Centralized, agent-agnostic skills and instructions repo for the api-obs-stack workspace"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Ivan Prytula", email = "ivanprytula.dev@gmail.com" }]
maintainers = [{ name = "Ivan Prytula", email = "ivanprytula.dev@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICEN[CS]E.*"]
keywords = ["agent", "skills", "instructions", "claude", "copilot", "kilo", "opencode", "codex"]

[dependency-groups]
dev = [
  "pre-commit>=4.6.1",
  "ruff>=0.16.2",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pycodestyle]
max-doc-length = 100
max-line-length = 100
